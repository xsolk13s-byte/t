<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یه دعوت ویژه برای تینا 💕</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
        .heart { position: fixed; font-size: 20px; color: rgba(255, 77, 109, 0.6); animation: fall linear infinite; z-index: 0; user-select: none; }
        @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0; } }
        
        .container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-radius: 28px; padding: 35px 25px; width: 100%; max-width: 480px; box-shadow: 0 20px 45px rgba(219, 68, 85, 0.22); position: relative; z-index: 1; text-align: center; }
        .slide { display: none; animation: fadeIn 0.5s ease; }
        .active { display: block; }
        
        h1 { color: #d63384; font-size: 1.4rem; margin-bottom: 20px; line-height: 1.6; }
        .emoji-icon { font-size: 60px; margin-bottom: 15px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .main-btn { background: linear-gradient(45deg, #ff4d6d, #ff758f); color: white; border: none; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); }

        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; font-weight: bold; color: #495057; margin-bottom: 8px; font-size: 0.9rem; }
        select, input[type="time"], input[type="date"] { width: 100%; padding: 12px; border: 2px solid #ffe3e3; border-radius: 12px; background: #fff5f5; outline: none; }
        
        .checkbox-group { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .checkbox-btn { background: #fff5f5; border: 2px solid #ffe3e3; padding: 10px; border-radius: 12px; cursor: pointer; text-align: center; font-size: 0.9rem; }
        .checkbox-btn.active { background: #ff4d6d; color: white; border-color: #ff4d6d; font-weight: bold; }
        
        .summary-box { background: #fff0f3; border: 1px dashed #ff4d6d; border-radius: 16px; padding: 15px; text-align: right; margin: 15px 0; font-size: 0.95rem; line-height: 1.8; color: #333; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <script>
        function createHeart() {
            const h = document.createElement('div'); h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw'; h.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(h); setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 500);

        function nextSlide(id) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById('slide-' + id).classList.add('active');
        }
    </script>

    <div class="container">
        <!-- اسلاید ۱ -->
        <div id="slide-1" class="slide active">
            <div class="emoji-icon">🤫</div>
            <h1>گوشتو بیار جلو تر میخوام چیزی بگم</h1>
            <div class="btn-group">
                <button class="main-btn" onclick="nextSlide(2)">آوردم</button>
            </div>
        </div>

        <!-- اسلاید ۲ -->
        <div id="slide-2" class="slide">
            <div class="emoji-icon">😠</div>
            <h1>عجبااا نیاوردی که همینطوری داری نگاه میکنییی</h1>
            <div class="btn-group">
                <button class="main-btn" onclick="nextSlide(3)">آوردم 😂</button>
            </div>
        </div>

        <!-- اسلاید ۳ -->
        <div id="slide-3" class="slide">
            <div class="emoji-icon">🐱</div>
            <p style="font-size: 0.9rem; color: #555; margin-bottom: 20px;">سینا بفهمه جرم میده ولی خیلی خوشگلیااااااا حق داره این همه دوست داره</p>
            <div class="btn-group">
                <button class="main-btn" style="background: #2ecc71;" onclick="nextSlide(4)">میخوام یه سوال بپرسم...</button>
            </div>
        </div>

        <!-- اسلاید ۴: سوال -->
        <div id="slide-4" class="slide">
            <div class="emoji-icon">❤️💕</div>
            <h1>با من میای دیت؟</h1>
            <div class="btn-group">
                <button class="main-btn" onclick="nextSlide(5)">بله</button>
                <button class="main-btn" onclick="nextSlide(5)">صد در صد</button>
            </div>
        </div>

        <!-- اسلاید ۵: فرم دیت -->
        <div id="slide-5" class="slide">
            <h1>خیلی خب، برنامه‌ریزی کنیم! ✨</h1>
            <form id="dateForm" onsubmit="event.preventDefault(); showSummary();">
                <div class="form-group">
                    <label>📍 کجا بریم؟</label>
                    <select id="location" required>
                        <option value="">انتخاب کن...</option>
                        <option value="کافه دنج">کافه دنج ☕</option>
                        <option value="رستوران">رستوران 🍝</option>
                        <option value="پارک">پارک 🌳</option>
                        <option value="سینما">سینما 🎬</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>📅 چه تاریخی؟</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>⏰ چه ساعتی؟</label>
                    <input type="time" id="time" required>
                </div>
                <div class="form-group">
                    <label>🎯 چه کارایی کنیم؟</label>
                    <div class="checkbox-group">
                        <div class="checkbox-btn" onclick="this.classList.toggle('active')">موزیک توی ماشین 🎧</div>
                        <div class="checkbox-btn" onclick="this.classList.toggle('active')">حرف زدن 💬</div>
                        <div class="checkbox-btn" onclick="this.classList.toggle('active')">پیاده‌روی 🚶‍♂️</div>
                    </div>
                </div>
                <button type="submit" class="main-btn">تایید نهایی 💕</button>
            </form>
        </div>

        <!-- اسلاید ۶: نتیجه -->
        <div id="slide-6" class="slide">
            <div class="emoji-icon">🥰</div>
            <h2>مرسی تینا قشنگم!</h2>
            <div class="summary-box" id="summaryText"></div>
            <a id="tgLink" href="#" class="main-btn" style="background: #0088cc; display: block; text-decoration: none;" target="_blank">📩 بزن بریم تلگرام سینا</a>
        </div>
    </div>

    <script>
        function showSummary() {
            const loc = document.getElementById('location').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const acts = Array.from(document.querySelectorAll('.checkbox-btn.active')).map(el => el.innerText).join('، ') || 'هرچی تو بگی!';
            
            const msg = `سلام سینا جان! تینا هستم، فرم دیت رو پر کردم:\n📍 مکان: ${loc}\n📅 تاریخ: ${date}\n⏰ ساعت: ${time}\n🎯 کارها: ${acts}`;
            const url = `https://t.me/Sina_saadat7?text=${encodeURIComponent(msg)}`;
            
            document.getElementById('summaryText').innerHTML = `
                <b>📍 مکان:</b> ${loc}<br>
                <b>📅 تاریخ:</b> ${date}<br>
                <b>⏰ ساعت:</b> ${time}<br>
                <b>🎯 کارها:</b> ${acts}
            `;
            document.getElementById('tgLink').href = url;
            nextSlide(6);
        }
    </script>
</body>
</html>
